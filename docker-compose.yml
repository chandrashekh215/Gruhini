version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gruhini-postgres
    restart: always
    environment:
      POSTGRES_DB: gruhini_db
      POSTGRES_USER: gruhini_user
      POSTGRES_PASSWORD: gruhini_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gruhini-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
